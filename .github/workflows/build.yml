name: Build PoC

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Windows host
        run: dotnet build windows-host/WsaBluetoothHost.csproj --configuration Release
      - name: Publish Windows host
        run: dotnet publish windows-host/WsaBluetoothHost.csproj --configuration Release --runtime win-x64 --self-contained false -o artifacts/windows-host
      - uses: actions/upload-artifact@v4
        with:
          name: WsaBluetoothHost-win-x64
          path: artifacts/windows-host

  android-test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore stable APK signing key
        run: base64 -d .github/ci/wsabt-debug.keystore.b64 > android-bridge/ci-debug.keystore
      - name: Build Android test client
        working-directory: android-bridge
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WsaBluetoothBridgeClient-debug
          path: android-bridge/app/build/outputs/apk/debug/app-debug.apk

  android-daemon:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi:
          - name: x86_64
            cmake_abi: x86_64
          - name: arm64-v8a
            cmake_abi: arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Configure daemon
        run: >
          cmake -S android-daemon -B build/android-daemon-${{ matrix.abi.name }}
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=${{ matrix.abi.cmake_abi }}
          -DANDROID_PLATFORM=android-30
          -DCMAKE_BUILD_TYPE=Release
      - name: Build daemon
        run: cmake --build build/android-daemon-${{ matrix.abi.name }} --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: wsa-btd-${{ matrix.abi.name }}
          path: build/android-daemon-${{ matrix.abi.name }}/wsa-btd
